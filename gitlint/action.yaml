name: Run gitlint
description: Lint commit messages using the organization-wide policy

runs:
  using: composite
  steps:
    - name: Install gitlint
      shell: bash
      run: sudo apt-get install -y gitlint

    - name: Run gitlint
      shell: bash
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        if [[ -n "$BASE_SHA" && -n "$HEAD_SHA" ]]; then
          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          gitlint --config "${{ github.action_path }}/.gitlint" --commits "$BASE_SHA..$HEAD_SHA"
        else
          gitlint --config "${{ github.action_path }}/.gitlint"
        fi

    - name: Reject placeholder tickets
      shell: bash
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        range="-1"
        if [[ -n "$BASE_SHA" && -n "$HEAD_SHA" ]]; then
          range="$BASE_SHA..$HEAD_SHA"
        fi

        bash "${{ github.action_path }}/reject-placeholder-tickets.sh" "$range"
